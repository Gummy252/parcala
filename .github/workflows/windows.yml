name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build the app page from source
        run: python kaynak/derle.py

      - name: Install dependencies
        run: npm install

      - name: Build the installer
        run: npm run dist

      - name: Read version
        id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Parcala-Kurulum
          path: dist/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: Parçala ${{ steps.version.outputs.v }}
          body: |
            Windows installer: **Parcala-Kurulum-${{ steps.version.outputs.v }}.exe**
            Download, double-click, install. If Windows SmartScreen warns about an unknown publisher: More info > Run anyway.
          files: dist/*.exe
          make_latest: true
