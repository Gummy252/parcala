<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Düzen: solda 3B görüntü alanı (dilimleyici tablası gibi), sağda adım adım kesim paneli; telefonda üst üste */
:root{
  --bg:#eef0ec; --panel:#fbfbf9; --fg:#1b2122; --muted:#5d6869; --line:#d6dbd5; --soft:#e5e9e3;
  --accent:#0d7a6a; --accent-fg:#ffffff; --cut:#e0571d; --warn:#b54708; --ok:#1c7c45;
  --stage:#e3e7e1; --grid:#c9cfc8;
  --f-display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121617; --panel:#191e1f; --fg:#e4eae9; --muted:#97a3a2; --line:#2b3334; --soft:#212829;
  --accent:#36bfa9; --accent-fg:#06211c; --cut:#ff7a3d; --warn:#f0a35e; --ok:#55c98a;
  --stage:#1b2122; --grid:#2a3233; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121617; --panel:#191e1f; --fg:#e4eae9; --muted:#97a3a2; --line:#2b3334; --soft:#212829;
  --accent:#36bfa9; --accent-fg:#06211c; --cut:#ff7a3d; --warn:#f0a35e; --ok:#55c98a;
  --stage:#1b2122; --grid:#2a3233; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;margin:0;overflow:hidden}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.uyg{height:100%;display:grid;grid-template-rows:auto 1fr;}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px}
.logo i b{border-radius:2px}
.logo i b:nth-child(1){background:var(--accent)} .logo i b:nth-child(2){background:var(--cut)} .logo i b:nth-child(3){background:var(--muted)} .logo i b:nth-child(4){background:var(--fg)}
.dosyaad{color:var(--muted);font-family:var(--f-mono);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.alan:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ana{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.ana:hover{filter:brightness(1.07)}
.btn.kucuk{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.govde{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.sahne{position:relative;min-width:0;min-height:0;background:var(--stage)}
canvas#gl{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#gl.secim{cursor:crosshair}
.ipucu{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.ipucu span{pointer-events:none;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px}
.ipucu span.vurgu{border-color:var(--cut);color:var(--cut);font-weight:600}
.eksenler{position:absolute;left:12px;bottom:12px;font-family:var(--f-mono);font-size:11px;color:var(--muted);pointer-events:none}
.birak{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--panel) 80%,transparent);font-family:var(--f-display);font-size:20px}
.ilerleme{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;width:min(340px,80%);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.ilerleme b{display:block;font-family:var(--f-display);margin-bottom:6px}
.ilerleme .cubuk{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:10px}
.ilerleme .cubuk i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.ilerleme .yazi{color:var(--muted);font-size:12.5px;min-height:1.3em}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;min-height:0;padding-block:14px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.bolum{display:flex;flex-direction:column;gap:8px}
.bilgi{font-size:13px;color:var(--muted);line-height:1.45}
.bilgi .sayi{font-family:var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.not{font-size:12.5px;border-left:3px solid var(--accent);padding:6px 10px;background:var(--soft);border-radius:0 6px 6px 0;line-height:1.45}
.not.uyari{border-color:var(--warn)}
.kesim{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.kesim.secili{border-color:var(--cut);box-shadow:0 0 0 1px var(--cut)}
.kbas{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
.kbas .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:18px}
.kbas .ad{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbas .tip{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.renkn{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:none}
.kgovde{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.kgovde .tam{grid-column:1/-1}
label.al{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.alan{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;width:100%;box-sizing:border-box;min-width:0}
input.alan[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kaydir{display:flex;gap:8px;align-items:center}
.kaydir input[type=range]{flex:1;accent-color:var(--cut);min-width:0}
.kaydir input[type=number]{width:78px;flex:none}
.renkler{display:flex;flex-wrap:wrap;gap:4px}
.renkler button{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.renkler button[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:1px}
.satir{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.parca{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r)}
.parca .hac{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.parca .durum{grid-column:2/-1;font-size:12px;color:var(--muted)}
.parca .durum.ok{color:var(--ok)}
.parca .durum.uy{color:var(--warn)}
.parca input.ad{border:none;background:transparent;font-weight:600;padding:2px 0;min-width:0;width:100%}
.parca .renkler{grid-column:1/-1}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.btn.nesne{justify-content:space-between;text-align:left;white-space:normal}
.btn.nesne .ad{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.btn.nesne .sayi{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.gorunumler{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
.gorunumler button{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.gorunumler button:hover{border-color:var(--muted)}
.gorunumler button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gorunumler .ayrac{width:1px;background:var(--line);margin:2px 2px}
.kanat-adim{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.kanat-adim div{display:flex;gap:8px;align-items:baseline}
.kanat-adim b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:11px;flex:none}
.kanat-adim .bitti{color:var(--fg)} .kanat-adim .bitti b{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kanat-adim .simdi{color:var(--cut);font-weight:600} .kanat-adim .simdi b{border-color:var(--cut)}
details .izgara{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.hata{color:var(--warn);font-size:13px}
.altbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:-14px;background:var(--panel);padding-block:10px 14px;margin-top:auto;border-top:1px solid var(--line)}
.altbar .btn.ana{flex:1;justify-content:center;padding:10px 12px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
@media (max-width:800px){
  body{overflow:auto}
  .uyg{height:auto}
  .govde{grid-template-columns:1fr}
  .sahne{height:56vh}
  aside{border-left:none;border-top:1px solid var(--line);overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="uyg">
  <header>
    <div class="logo"><i><b></b><b></b><b></b><b></b></i>Parçala</div>

    <input type="file" id="dosya" accept=".stl,.3mf" hidden>

  </header>
  <div class="govde">

<script>
'use strict';
// ====================================================================== işçi (Web Worker)
function isciAna(M, gonder) {
  let model = null, sonuc = null, bekleyen = null;
  return async function (msg) {
    try {
      if (msg.tip === 'yukle' || msg.tip === 'nesneSec') {
        if (msg.tip === 'yukle') bekleyen = { ad: msg.ad, buf: msg.buf };
        const r = await M.yukle(bekleyen.ad, bekleyen.buf, s => gonder({ tip: 'ilerle', yazi: s }), msg.secim);
        if (r.secimGerek) { gonder({ tip: 'secim', liste: r.liste }); return; }
        bekleyen = null;
        model = { V: r.V, F: r.F }; sonuc = null;
        gonder({ tip: 'ilerle', yazi: 'Kontrol ediliyor' });
        const { lo, hi } = M.sinirlar(r.V); const kap = M.kapaliMi(r.V, r.F);
        const V32 = Float32Array.from(r.V), F2 = r.F.slice();
        const aktar = [V32.buffer, F2.buffer]; if (r.renk) aktar.push(r.renk.buffer);
        gonder({ tip: 'model', V: V32, F: F2, parcalar: r.parcalar, lo, hi, hacim: M.hacim(r.V, r.F), kapali: kap, renk: r.renk, filament: r.filament }, aktar);
      } else if (msg.tip === 'kes') {
        const ayar = msg.ayar; const parcalar = new Map([['model', model]]); const pimler = []; const n = msg.kesimler.length;
        for (let i = 0; i < n; i++) {
          const k = msg.kesimler[i];
          gonder({ tip: 'ilerle', yazi: `${i + 1}/${n} · ${k.ad} kesiliyor`, oran: i / n });
          const src = parcalar.get(k.hedef);
          if (!src) throw new Error(`"${k.ad}": seçilen hedef parça yok`);
          if (k.tip === 'duz') {
            const ix = 'xyz'.indexOf(k.eksen); const nrm = [0, 0, 0]; nrm[ix] = 1; const nokta = [0, 0, 0]; nokta[ix] = k.konum;
            let pim = null;
            if (k.pim !== 'yok') {
              const yeniUst = k.yeniTaraf === 'ust';
              const tip = k.pim === 'dubel' ? 'dubel' : ((k.pim === 'yeni') === yeniUst ? 'ust_erkek' : 'alt_erkek');
              pim = { tip, cap: k.pimCap, boy: k.pimBoy };
            }
            const alan = k.alanHazir || null;
            const r = M.duzKes(src.V, src.F, { nokta, normal: nrm, pim, alan, yeniUst: k.yeniTaraf === 'ust' }, ayar);
            const yeni = k.yeniTaraf === 'ust' ? r.ust : r.alt, kalan = k.yeniTaraf === 'ust' ? r.alt : r.ust;
            if (!yeni || !kalan) throw new Error(`"${k.ad}": kesim düzlemi hedef parçayı kesmiyor. Konumu değiştir.`);
            parcalar.set(k.hedef, kalan); parcalar.set(k.id, yeni);
            if (r.pim) pimler.push({ ad: k.ad, r: r.pim.r, L: r.pim.L });
          } else {
            if (!k.nokta) throw new Error(`"${k.ad}": modelde yer seçilmedi`);
            // akıllı seçimde kesim duvarı bölgenin yan duvarıyla çakışabilir: olmazsa sınırı biraz dışarı/içeri alıp yeniden dene
            const paylar = k.mod === 'bolge' ? [k.icPay, k.icPay - 0.25, k.icPay + 0.25, k.icPay - 0.5] : [k.icPay];
            let r, sonHata;
            for (const icPay of paylar) {
              try { r = M.tikacKes(src.V, src.F, {
              nokta: k.nokta, yon: k.yon, yukari: k.yukari || undefined, derinlik: k.derinlik, duvar: k.duvar, icPay,
              taban: { sekil: k.sekil, en: k.en, boy: k.boy, aci: k.aci, kaydirU: k.kaydirU, kaydirV: k.kaydirV, noktalar: k.noktalar },
              anahtar: k.anahtar ? { u: k.kaydirU, v: k.kaydirV + Math.min(k.en, k.boy) * 0.22, cap: Math.max(1.6, Math.min(2.6, Math.min(k.en, k.boy) * 0.2)), derinlik: 1.0 } : null
            }, ayar); break; } catch (e) { sonHata = e; if (paylar.length > 1) gonder({ tip: 'ilerle', yazi: `"${k.ad}": kesim sınırı ayarlanıp yeniden deneniyor`, oran: 0.5 }); }
            }
            if (!r) throw sonHata;
            if (!r.parca) throw new Error(`"${k.ad}": tıkaç "${k.hedefAd || 'seçilen'}" parçasına değmiyor. Tıkladığın yer başka bir parçada kalıyor olabilir: "Kesilecek parça"yı kontrol et ya da yeri yeniden seç.`);
            if (!r.kalan) throw new Error(`"${k.ad}": tıkaç hedef parçanın tamamını kaplıyor. Tabanı küçült ya da derinliği azalt.`);
            parcalar.set(k.id, r.parca); parcalar.set(k.hedef, r.kalan);
          }
        }
        gonder({ tip: 'ilerle', yazi: 'Parçalar kontrol ediliyor', oran: 0.98 });
        sonuc = { parcalar, pimler };
        const liste = [], aktar = [];
        for (const [id, p] of parcalar) {
          const V32 = Float32Array.from(p.V), F2 = p.F.slice(); aktar.push(V32.buffer, F2.buffer);
          liste.push({ id, V: V32, F: F2, hacim: M.hacim(p.V, p.F), kapali: M.kapaliMi(p.V, p.F) });
        }
        const modelKap = M.kapaliMi(model.V, model.F);
        gonder({ tip: 'sonuc', liste, pimler, modelKusur: modelKap.tekrar + modelKap.acik }, aktar);
      } else if (msg.tip === 'disari') {
        if (!sonuc) throw new Error('Önce parçala');
        const dosyalar = []; const yerinde = [];
        msg.parcalar.forEach((p, i) => {
          const s = sonuc.parcalar.get(p.id); if (!s) return;
          dosyalar.push({ ad: `${String(i + 1).padStart(2, '0')}_${p.dosyaAd}_${p.renkAd}.stl`, veri: M.stlYaz(s.V, s.F) });
          yerinde.push({ ad: p.ad, V: s.V, F: s.F });
        });
        sonuc.pimler.forEach((p, i) => { const m = M.pimMesh(p.r, p.L); dosyalar.push({ ad: `pim_${i + 1}_cap${(2 * p.r).toFixed(1)}_boy${p.L.toFixed(1)}.stl`, veri: M.stlYaz(m.V, m.F) }); });
        gonder({ tip: 'ilerle', yazi: 'Birleşik kontrol dosyası yazılıyor' });
        const kontrol = await new Response(await M.ucmfYaz(yerinde)).arrayBuffer();
        dosyalar.push({ ad: 'birlesik_kontrol.3mf', veri: new Uint8Array(kontrol) });
        dosyalar.push({ ad: 'OKU.txt', veri: new TextEncoder().encode(msg.oku) });
        gonder({ tip: 'ilerle', yazi: 'Sıkıştırılıyor' });
        gonder({ tip: 'zip', blob: await M.zipYaz(dosyalar) });
      }
    } catch (e) { gonder({ tip: 'hata', yazi: (e && e.message) || String(e) }); }
  };
}

// ====================================================================== motor bağlantısı
const yardimci = parcalaMotoru();
const Masaustu = window.parcalaMasaustu || null;   // Windows programı içinde çalışıyorsa
const Motor = (() => {
  let dinleyici = () => {}; let isle;
  try {
    const kaynak = `${parcalaMotoru.toString()}\n${isciAna.toString()}\nconst __h = isciAna(parcalaMotoru(), (m, t) => postMessage(m, t || []));\nonmessage = e => __h(e.data);`;
    const w = new Worker(URL.createObjectURL(new Blob([kaynak], { type: 'text/javascript' })));
    w.onmessage = e => dinleyici(e.data);
    w.onerror = e => dinleyici({ tip: 'hata', yazi: 'Arka plan işlemi çöktü: ' + (e.message || 'bellek yetmemiş olabilir') });
    isle = (m, t) => w.postMessage(m, t || []);
  } catch (e) {
    const h = isciAna(parcalaMotoru(), m => setTimeout(() => dinleyici(m), 0));
    isle = m => setTimeout(() => h(m), 30);
  }
  return { gonder: isle, dinle: f => { dinleyici = f; } };
})();

// ====================================================================== matematik
const m4 = {
  carp(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; },
  persp(f, a, n, fr) { const t = 1 / Math.tan(f / 2), o = new Float32Array(16); o[0] = t / a; o[5] = t; o[10] = (fr + n) / (n - fr); o[11] = -1; o[14] = 2 * fr * n / (n - fr); return o; },
  bak(e, c, u) {
    let z = [e[0] - c[0], e[1] - c[1], e[2] - c[2]]; let l = Math.hypot(...z); z = z.map(x => x / l);
    let x = [u[1] * z[2] - u[2] * z[1], u[2] * z[0] - u[0] * z[2], u[0] * z[1] - u[1] * z[0]]; l = Math.hypot(...x); x = x.map(q => q / l);
    const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];

      try { await dl.save({ filename: ad, data: r.blob }); }
      catch (e) { if (e && e.code !== 'declined') { D.hata = 'İndirme yapılamadı: ' + (e.message || e.code); panelCiz(); } }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(r.blob); a.download = ad; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    }
  } catch (e) { panelCiz(); }
}

// ====================================================================== örnek model: oyuncak roket (dönel yüzey)
function ornekRoket() {
  const prof = [[0, 0], [7, 0], [7.5, 0.5], [7.5, 5], [9, 6], [11, 6], [11, 8], [14, 8], [15, 10], [15, 24], [14.4, 24.4], [14.4, 25.6], [15, 26], [15, 58], [14.4, 58.4], [14.4, 59.6], [15, 60]];
  for (let i = 1; i <= 24; i++) { const t = i / 24; prof.push([15 * Math.sqrt(Math.max(0, 1 - t * t)) * (1 - 0.15 * t), 60 + 34 * t]); }
  prof[prof.length - 1] = [0, 94];
  const n = 128; const V = [], F = [];
  const halka = []; for (const [r, z] of prof) { if (r === 0) { halka.push(V.length / 3); V.push(0, 0, z); continue; } const b = V.length / 3; halka.push(-b - 1); for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n; V.push(r * Math.cos(a), r * Math.sin(a), z); } }
  for (let k = 0; k < prof.length - 1; k++) {
    const A = halka[k], B = halka[k + 1];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      if (A >= 0) F.push(A, -B - 1 + j, -B - 1 + i);
      else if (B >= 0) F.push(-A - 1 + i, -A - 1 + j, B);
      else { const a = -A - 1, b = -B - 1; F.push(a + i, a + j, b + j, a + i, b + j, b + i); }
    }
  }
  // alt kapak yönü: z=0 merkezden halkaya
  return yardimci.stlYaz(Float64Array.from(V), Uint32Array.from(F));
}
